# jekyll config
title: "just-obsidian-docs"
description: "Template repository for Jekyll and Just the Docs for Obsidian vaults"
# do not leave blank if your URL is https://domain_name.xyz/something
baseurl: "/just-obsidian-docs" # put /something here
url: "https://ngivanyh.github.io"

# just-the-docs config
remote_theme: just-the-docs/just-the-docs
color_scheme: "dark"
aux_links:
  "just-obsidian-docs On Github":
    - "https://github.com/ngivanyh/just-obsidian-docs/"
aux_links_new_tab: true

# source: "vault_name/"

# file exclusions
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .obsidian/
  - .trash/
  - .github/
  - "*.py"
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - node_modules/
